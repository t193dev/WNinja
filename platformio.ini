
[env:wninja_cyd]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

lib_deps =
    bodmer/TFT_eSPI
    paulstoffregen/XPT2046_Touchscreen

build_flags =
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TOUCH_CS=33
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SPI_FREQUENCY=27000000
    -D SPI_READ_FREQUENCY=16000000
